name: CodeQL agent review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: codeql-agents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Run CodeQL security agents
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.94

      - name: Run CodeQL security agents
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          copilot \
            --agent=codeql-security \
            --prompt="Perform a read-only security review of the checked-out project using the CodeQL security specialist agents. Return only a severity-ranked Markdown report with file-and-line evidence. Do not claim a CodeQL query was executed unless CodeQL results are available in the review context. Do not modify the repository." \
            --silent \
            --no-ask-user \
            --allow-tool=read \
            --deny-tool=write \
            --deny-tool=shell \
            --deny-tool=url \
            --deny-tool=memory \
            > artifacts/codeql-agent-review.md
          test -s artifacts/codeql-agent-review.md

      - name: Add report to job summary
        run: cat artifacts/codeql-agent-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CodeQL agent review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-agent-review
          path: artifacts/codeql-agent-review.md
          if-no-files-found: error
          retention-days: 14
